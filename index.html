  input[type="file"] { display: none; }
  /* iOS Safari auto-zooms the whole page when a focused input's font-size is under
     16px. Force 16px on focus only (keeps the visual size elsewhere unchanged) so
     typing in any field doesn't yank the viewport in and out. */

    input:focus, textarea:focus, select:focus { font-size: 16px !important; }
  }
  /* Progress bar — made 2px tall (was 1px, too thin to be visible at a glance)
     and given a subtle rounding so the fill indicator reads as a single continuous
     arc rather than a hard rectangle. */

  .progress-bar > div { background: var(--primary); height: 100%; transition: width 0.3s ease-out; border-radius: 9999px; }

  /* Accessibility: respect the user's reduced-motion preference. Previously the reveal

     and transitions collapse to ~0ms so the content still appears, just without
     movement. */

      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;

// If anything in the script below throws, the page would otherwise render blank

(function () {
  function showErrorBanner(label, details) {
    try {
      var div = document.createElement('div');
      div.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#B3452E;color:#fff;padding:14px 18px;font-family:Menlo,Consolas,monospace;font-size:12px;line-height:1.5;white-space:pre-wrap;max-height:60vh;overflow:auto;border-bottom:2px solid #8a2a1d';
      div.innerHTML = '<strong style="display:block;margin-bottom:6px;font-size:14px;">' + label + '</strong>' +
        '<div style="opacity:0.95;">' + (details || '(no details)') + '</div>' +
        '<div style="margin-top:8px;font-size:11px;opacity:0.8;">Take a screenshot of this message and send it to support.</div>';
      document.body.appendChild(div);
    } catch (e) { /* nothing else we can do */ }
  }
  window.addEventListener('error', function (e) {
    var msg = e.message || 'Unknown error';
    if (e.filename) msg += '\nFile: ' + e.filename;
    if (e.lineno)  msg += '\nLine: ' + e.lineno + (e.colno ? ':' + e.colno : '');
    if (e.error && e.error.stack) msg += '\n\nStack:\n' + e.error.stack;
    showErrorBanner('JavaScript Error', msg);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    var msg = (r && r.message) ? r.message : String(r);
    if (r && r.stack) msg += '\n\nStack:\n' + r.stack;
    showErrorBanner('Promise Rejection', msg);
  });
})();

// Build the full perfume list (archetypes + user placeholders)
function buildDefaultPerfumes() {
  // Only user perfumes (ATEED-branded) — archetypes are NOT included in the catalog.
  // Archetype data (tagline, description, notes, etc.) is still used as the source
  // for each user perfume's content, but the archetypes themselves are never shown.
  const list = [];
  USER_PERFUME_SPECS.forEach((spec, i) => {
    const arch = ARCHETYPES.find(a => a.slug === spec.archetype);
    list.push({
      id: "user-" + spec.displayLabel.toLowerCase() + "-" + spec.archetype,
      slug: "user-" + spec.displayLabel.toLowerCase() + "-" + spec.archetype,
      name: arch.name,
      displayLabel: spec.displayLabel,
      // NEW: optional gender-specific female name. Used by displayName(p, gender)
      // when a female customer is viewing the perfume (e.g. ATEED Wahha → ATEED AMIRA
      // for female viewers). Empty string means "use the default displayLabel for
      // all viewers" — most perfumes don't have a female-specific name.
      displayLabelFemale: spec.displayLabelFemale || "",
      family: arch.family, familyEn: arch.familyEn, familyAr: arch.familyAr,
      timeOfDay: arch.timeOfDay, timeOfDayEn: arch.timeOfDayEn, timeOfDayAr: arch.timeOfDayAr,
      topNotesEn: arch.topNotesEn, topNotesAr: arch.topNotesAr,
      heartNotesEn: arch.heartNotesEn, heartNotesAr: arch.heartNotesAr,
      baseNotesEn: arch.baseNotesEn, baseNotesAr: arch.baseNotesAr,
      personalityEn: arch.personalityEn, personalityAr: arch.personalityAr,
      whyMatchEn: spec.whyMatchEn || arch.whyMatchEn, whyMatchAr: spec.whyMatchAr || arch.whyMatchAr,
      price: spec.price,
      size: spec.size,
      taglineEn: spec.taglineEn || arch.taglineEn,
      taglineAr: spec.taglineAr || arch.taglineAr,
      descriptionEn: spec.descriptionEn || arch.descriptionEn,
      descriptionAr: spec.descriptionAr || arch.descriptionAr,
      gradient: arch.gradient, accent: arch.accent,
      imageUrl: "", imageUrlMale: "", imageUrlFemale: "", inspiredBy: spec.inspiredBy,
      profile: spec.profile, // ← per-perfume answer profile for accurate matching
      archetype: spec.archetype, // ← explicit archetype slug (e.g. "sea-breeze") for grouping/scoring
      gender: spec.gender, // ← "male" | "female" | "unisex" — unisex perfumes carry a separate
      // imageUrlMale / imageUrlFemale bottle photo (imageUrl is used for single-gender perfumes)
      isArchetype: false,
      // NEW: isShipped flag marks this perfume as part of the shipped (developer-controlled)
      // catalog. The migration logic in loadData() uses this to distinguish "perfume that
      // was once shipped but has since been removed from the source code" (e.g. ATEED Rumman,
      // ATEED Noir — both deleted) from "perfume the admin created via the perfume editor".
      // When a saved record has isShipped: true but no counterpart exists in the current
      // defaults, the migration drops it. Admin-created perfumes (isShipped: false or
      // missing) are always preserved even if their ID isn't in defaults.
      isShipped: true,
      // NEW: every perfume has an enabled flag. Brand admin can toggle this off (e.g. when
      // the perfume is sold out or temporarily unavailable) and it will be hidden from the
      // quiz results AND the collection grid — without deleting the perfume record itself.
      // Default true so existing perfumes stay visible until the admin decides otherwise.
      enabled: true,
      sortOrder: i,
    });
  });
  return list;
}

// Get zodiac sign from a birthdate (YYYY-MM-DD or Date)
function getZodiac(birthdate) {
  if (!birthdate) return null;
  const d = new Date(birthdate);
  if (isNaN(d.getTime())) return null;
  const m = d.getMonth() + 1; // 1-12
  const day = d.getDate();
  // date ranges (start month/day, end month/day)
  const ranges = [
    { id: "capricorn", start: [12, 22], end: [1, 19] },
    { id: "aquarius", start: [1, 20], end: [2, 18] },
    { id: "pisces", start: [2, 19], end: [3, 20] },
    { id: "aries", start: [3, 21], end: [4, 19] },
    { id: "taurus", start: [4, 20], end: [5, 20] },
    { id: "gemini", start: [5, 21], end: [6, 20] },
    { id: "cancer", start: [6, 21], end: [7, 22] },
    { id: "leo", start: [7, 23], end: [8, 22] },
    { id: "virgo", start: [8, 23], end: [9, 22] },
    { id: "libra", start: [9, 23], end: [10, 22] },
    { id: "scorpio", start: [10, 23], end: [11, 21] },
    { id: "sagittarius", start: [11, 22], end: [12, 21] },
  ];
  for (const r of ranges) {
    const [sm, sd] = r.start;
    const [em, ed] = r.end;
    if (sm === em) {
      if (m === sm && day >= sd && day <= ed) return ZODIAC_SIGNS.find(z => z.id === r.id);
    } else if (sm > em) {
      // wraps year-end (Capricorn)
      if ((m === sm && day >= sd) || (m === em && day <= ed)) return ZODIAC_SIGNS.find(z => z.id === r.id);
    } else {
      if ((m === sm && day >= sd) || (m === em && day <= ed)) return ZODIAC_SIGNS.find(z => z.id === r.id);
    }
  }
  return null;
}

// ====================== STATE ======================
// STORAGE_KEY bumped from v5 → v6: this version moves the user-provided long-form copy
// from `description` fields to `whyMatch` fields (the user's brief was tagline +
// "why this matches you" + price — not tagline + description + price). The perfume
// `description` now inherits from the per-archetype defaults in ARCHETYPES, while
// `whyMatch` is overridden per-perfume with the user's copy. Any browser with a v5
// saved state (which had the copy in the wrong field) will NOT find a v6 key, so it
// boots from defaults — guaranteeing the correct placement of every text.
// from the data model and the admin editor. Any browser with a v3 saved state that
// still carries price fields will NOT find a v4 key, so it boots from defaults
// (which have no price) — this prevents any stale price data from leaking through.
// Combined with the migration logic below (which no longer copies `price` from
// saved state), this also protects against future drift.
const STORAGE_KEY = "ateed-scent-data-v7";
const LANG_KEY = "ateed-lang";

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // === Strong content-refresh migration ===
      // The previous migration only refreshed `archetype` and `profile` from defaults —
      // every other field (tagline, description, notes, personality, whyMatch, price,
      // size, inspiredBy, gradient, accent, name, displayLabel) was preserved from
      // the saved state. That meant: if the developer updated a perfume's description
      // or corrected a price in the source code, browsers that already had a saved
      // catalog kept showing the OLD description and OLD price forever, because the
      // saved value silently won.
      //
      // The new strategy treats each perfume field by category:
      //   (a) Admin-controlled state (image uploads, enabled flag, sort order):
      //       ALWAYS keep the saved value — refreshing these would wipe the admin's work.
      //   (b) Admin-controlled content fields (displayLabel, tagline, description, notes,
      //       personality, whyMatch, family, timeOfDay, price, size, inspiredBy, gender):
      //       In theory these can be edited via the perfume editor. In practice, when the
      //       developer ships a catalog content update, the saved values are stale
      //       defaults from a previous iteration — admins who explicitly edited a field
      //       are vanishingly rare, and even if an edit is lost, the admin can re-edit via
      //       the UI. So we ALWAYS refresh these from defaults to guarantee content
      //       updates reach every browser. (The admin UI remains the source of truth
      //       going forward — the next save will pick up the new default as the new
      //       baseline.)
      //   (c) Developer-controlled fields (archetype, profile, gradient, accent, name,
      //       isArchetype): NEVER editable in the admin UI, so always refresh from defaults.
      //
      // This means: opening a fresh copy of this file in a browser that already has a
      // saved catalog will silently replace all perfume content with the developer's
      // latest defaults — while preserving any uploaded bottle photos, the enabled
      // flag, and the admin's custom sort order.
      const defaults = buildDefaultPerfumes();
      const defaultsById = {};
      defaults.forEach(d => { defaultsById[d.id] = d; });
      const savedList = parsed.perfumes || defaults;
      const seenIds = new Set();
      // NEW: filter out saved perfumes that were once shipped (isShipped: true) but no
      // longer exist in the current defaults. This handles the case where a perfume
      // was deleted from the source code (e.g. ATEED Rumman, ATEED Noir) — the saved
      // state still has them, but they shouldn't appear in the new catalog.
      // Admin-created perfumes (isShipped: false or missing) are ALWAYS preserved even
      // if their ID isn't in defaults — the admin explicitly created them.
      const droppedPerfumeIds = [];
      const filteredList = savedList.filter(p => {
        if (p.isShipped === true && !defaultsById[p.id]) {
          droppedPerfumeIds.push(p.id);
          return false; // drop — was shipped but removed from defaults
        }
        return true; // keep — either in defaults, or admin-created
      });
      const perfumes = filteredList.map(p => {
        seenIds.add(p.id);
        const def = defaultsById[p.id];
        if (!def) return p; // an admin-created perfume with no shipped counterpart — never touched
        // Build the merged record explicitly so we control exactly which fields are
        // preserved vs refreshed. The order matters: explicit assignments below override
        // any field that might leak through from the spread of `p`.
        return {
          // Identity & developer-controlled fields — ALWAYS from defaults
          id: def.id,
          slug: def.slug,
          name: def.name,
          archetype: def.archetype,
          profile: def.profile,
          gradient: def.gradient,
          accent: def.accent,
          isArchetype: false,
          isShipped: true, // always set — shipped perfumes are tracked via this flag
          // Content fields — ALWAYS refreshed from defaults so content updates reach
          // every browser. (See comment above for rationale.)
          displayLabel: def.displayLabel,
          // NEW: gender-specific female name — always refreshed from defaults (it's
          // content, not admin state — admins edit the male displayLabel only).
          displayLabelFemale: def.displayLabelFemale || "",
          taglineEn: def.taglineEn, taglineAr: def.taglineAr,
          descriptionEn: def.descriptionEn, descriptionAr: def.descriptionAr,
          family: def.family, familyEn: def.familyEn, familyAr: def.familyAr,
          timeOfDay: def.timeOfDay, timeOfDayEn: def.timeOfDayEn, timeOfDayAr: def.timeOfDayAr,
          topNotesEn: def.topNotesEn, topNotesAr: def.topNotesAr,
          heartNotesEn: def.heartNotesEn, heartNotesAr: def.heartNotesAr,
          baseNotesEn: def.baseNotesEn, baseNotesAr: def.baseNotesAr,
          personalityEn: def.personalityEn, personalityAr: def.personalityAr,
          whyMatchEn: def.whyMatchEn, whyMatchAr: def.whyMatchAr,
          price: def.price,
          size: def.size,
          inspiredBy: def.inspiredBy,
          // Gender: admin UI controls it via the perfume editor dropdown. For perfumes
          // saved BEFORE the gender field existed (no archetype field set), use the
          // current default. For perfumes saved AFTER, keep the saved value so the
          // admin's gender choice survives the content refresh.
          gender: p.archetype === undefined ? def.gender : (p.gender || def.gender),
          // Admin-controlled state — ALWAYS preserve from saved state (with safe defaults)
          imageUrl:        p.imageUrl        !== undefined ? p.imageUrl        : "",
          imageUrlMale:    p.imageUrlMale    !== undefined ? p.imageUrlMale    : "",
          imageUrlFemale:  p.imageUrlFemale  !== undefined ? p.imageUrlFemale  : "",
          enabled:         p.enabled         !== undefined ? p.enabled         : true,
          sortOrder:       p.sortOrder       !== undefined ? p.sortOrder       : def.sortOrder,
        };
      });
      // Bring in any newly-added curated perfumes this browser hasn't seen/saved yet
      defaults.forEach(d => { if (!seenIds.has(d.id)) perfumes.push(d); });
      return {
        brand: { ...DEFAULT_BRAND, ...parsed.brand },
        perfumes,
        adminPassword: parsed.adminPassword || "ateed2026",
      };
    }
  } catch (e) {}
  return { brand: { ...DEFAULT_BRAND }, perfumes: buildDefaultPerfumes(), adminPassword: "ateed2026" };
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    // Most commonly QuotaExceededError from too many/too-large uploaded images.
    // Fail loudly — a silent failure here means the admin thinks their edit saved when it didn't.
    showToast(t(UI.saveFailedTitle), t(UI.saveFailedDesc));
    return false;
  }
}

// Returns the perfume's customer-facing name. The optional `gender` parameter lets
// unisex perfumes show a gender-specific name when the customer is female (e.g. the
// perfume "ATEED Wahha" displays as "ATEED AMIRA" for female viewers). When `gender`
// is omitted (e.g. in the admin panel, or contexts where the viewer's gender is
// unknown), the default displayLabel is used — so the admin still sees the canonical
// name they edit in the perfume editor.
function displayName(p, gender) {
  if (gender && gender === "female" && p.displayLabelFemale && String(p.displayLabelFemale).trim().length > 0) {
    return p.displayLabelFemale;
  }
  const label = (p.displayLabel || "").trim();
  return label.length > 0 ? label : p.name;
}

// Turns the raw quiz signals (which answers matched, the customer's zodiac trait) into one

function buildMatchNarrative(perfume, topReasons, zodiac, gender) {
  const isAr = lang === "ar";

  // number interactions, we wrap it in explicit LRE/PDF marks so the Latin name renders
  // LTR even inside a RTL paragraph. This is invisible to the user but ensures the name
  // never reads "jumbled" in Arabic mode.
  const LRE = "\u202A"; // Left-to-Right Embedding
  const PDF = "\u202C"; // Pop Directional Formatting

  // Occasion, scent-family, and season answers ("work or office", "warm and spicy") are not things
  // a person "is" — prefer personality-flavored reasons for that phrasing, and fall back to a
  // phrasing that works for any answer type when none of the top matches are personality-based.
  const personalityReasons = topReasons.filter(r => r.category === "Personality" || r.category === "Mood");
  const chosen = personalityReasons.length > 0 ? personalityReasons : topReasons;

        : `شخصيتك الـ${lower1} هي السبب إن ${name} حسّيته أقرب عطر ليك — طابعه الـ${family} مبني على نفس الإحساس ده.`,

        : `اختيارك لـ${lower1} هو اللي وجّه الطريق لـ${name} — طابعه ${family} صدى مباشر لده.`,

      : `${lower1.charAt(0).toUpperCase() + lower1.slice(1)} is the core of how you move through a room, and ${name} carries that same charge in its ${family} composition — as if it had been waiting for someone exactly like you.`,

// Resolve the correct bottle photo for a perfume given the viewer's gender context.
// Falls back through: perfume's own photo → matching gender's default bottle → opposite
// gender's default bottle → empty string. The default bottles are brand-level
// (state.brand.defaultMaleBottleUrl / defaultFemaleBottleUrl) and are uploaded once
// in the admin Brand tab — this means most perfumes need ZERO uploaded photos,
// which solves the localStorage quota problem (each base64 photo is 50-200KB and
// the browser's storage cap is ~5MB, so a catalog of 20 unisex perfumes with two
// photos each would blow the quota — now they all share two generic bottles).
function getPerfumeImage(perfume, gender) {
  if (!perfume) return "";
  const defaultMale = (state && state.brand && state.brand.defaultMaleBottleUrl) || "";
  const defaultFemale = (state && state.brand && state.brand.defaultFemaleBottleUrl) || "";
  if (perfume.gender === "unisex") {
    if (gender === "female") return perfume.imageUrlFemale || perfume.imageUrlMale || perfume.imageUrl || defaultFemale || defaultMale || "";
    if (gender === "male")   return perfume.imageUrlMale   || perfume.imageUrlFemale || perfume.imageUrl || defaultMale   || defaultFemale || "";
    // No gender context (e.g. admin catalog thumbnail) — show the female bottle by default
    return perfume.imageUrlFemale || perfume.imageUrlMale || perfume.imageUrl || defaultFemale || defaultMale || "";
  }
  // Single-gender perfume: prefer its own photo, fall back to the matching default bottle
  if (perfume.gender === "female") {
    return perfume.imageUrl || perfume.imageUrlFemale || perfume.imageUrlMale || defaultFemale || defaultMale || "";
  }
  // male (or legacy undefined gender — treat as male)
  return perfume.imageUrl || perfume.imageUrlMale || perfume.imageUrlFemale || defaultMale || defaultFemale || "";
}

// Resolve which archetype/family a perfume belongs to, for grouping and scoring.
// Prefers the perfume's explicit `archetype` field (set for every curated USER_PERFUME_SPECS
// entry). Falls back to parsing the slug for perfumes that predate that field or were
// created ad hoc from the admin panel (id pattern: "user-<name>-<family-or-archetype>").
// NOTE: the slug-parsing fallback only works when the name portion has no spaces/hyphens
// of its own — it's a best-effort fallback, not a substitute for the explicit field.
function perfumeArchetypeSlug(p) {
  if (p.archetype) return p.archetype;
  return p.slug.match(/^user-[a-z0-9]+-(.+)$/)?.[1] || p.slug;
}

// ====================== SCORING ======================
function recommendPerfume(answers, perfumes, gender) {
  // === Smart per-perfume scoring with gender filtering + disliked-note penalty ===
  // 1. Filter perfumes by gender (male sees male+unisex, female sees female+unisex)
  // 2. Score each perfume by weighted similarity to its ideal profile
  // 3. Penalize perfumes that contain notes the user dislikes (question d1)
  // 4. Tiebreaker for same-archetype perfumes
  // Filter: only include user perfumes (not archetypes) that have a profile AND are
  // currently enabled. The admin can disable a perfume (e.g. sold out) via the toggle
  // in the perfume editor — disabled perfumes must never appear in quiz results.
  let userPerfumes = perfumes.filter(p => !p.isArchetype && p.profile && p.enabled !== false);
  if (userPerfumes.length === 0) {
    return recommendArchetypeFallback(answers, perfumes);
  }
  // Filter by gender if provided
  if (gender) {
    const filtered = userPerfumes.filter(p => p.gender === gender || p.gender === "unisex");
    if (filtered.length > 0) userPerfumes = filtered;
  }
  // Determine which questions were actually answered.
  // BUG FIX: also include couple-specific question IDs (e.g. "cd1") so that
  // couple quiz answers actually contribute to scoring. Previously, only
  // QUIZ_QUESTIONS was scanned here — so any couple-only question id was
  // silently dropped from the scoring loop, leaving the match running on a
  // partial answer set.
  const soloAnswered = QUIZ_QUESTIONS.filter(q => answers[q.id] !== undefined);
  const coupleAnswered = (typeof COUPLE_QUIZ_QUESTIONS !== "undefined")
    ? COUPLE_QUIZ_QUESTIONS.filter(q => answers[q.id] !== undefined && !QUIZ_QUESTIONS.some(rq => rq.id === q.id))
    : [];
  const answeredQs = [...soloAnswered, ...coupleAnswered];
  if (answeredQs.length === 0) {
    const fallbackOptions = userPerfumes.slice(0, 3).map(p => ({ perfume: p, matchScore: 0, topReasons: [] }));
    return { perfume: userPerfumes[0], matchScore: 0, topReasons: [], options: fallbackOptions };
  }
  // Question weights — higher weight = more important for matching
  const questionWeights = {
    p1: 1.5,
    m1: 1.3, m2: 1.0,
    o1: 1.2, o2: 1.1,
    s1: 1.5, s2: 1.2, s3: 2.0,  // s3 (favorite note) is the heaviest
    d1: 1.8,  // disliked note — strong negative signal
    t2: 1.0,
  };
  const totalWeight = answeredQs.reduce((sum, q) => sum + (questionWeights[q.id] || 1), 0);
  // Score each user perfume
  const scored = userPerfumes.map(p => {
    let exactWeight = 0;
    let nearWeight = 0;
    let exactCount = 0;
    let nearCount = 0;
    let dislikedPenalty = 0;
    const matchDetails = [];
    for (const q of answeredQs) {
      const userAns = answers[q.id];
      const idealAns = p.profile[q.id];
      const w = questionWeights[q.id] || 1;
      if (q.id === "d1") {
        // Special handling for disliked notes: if the perfume's archetype is in the
        // "disliked" list for the user's answer, apply a penalty instead of a match.
        const opt = q.options[userAns];
        const archSlug = perfumeArchetypeSlug(p);
        if (opt && archSlug && opt.scores.includes(archSlug)) {
          // This perfume's archetype is in the disliked list — penalize it
          dislikedPenalty += w * 0.8;
        } else {
          // Not disliked — small positive signal
          exactWeight += w * 0.3;
        }
        continue;
      }
      if (userAns === idealAns) {
        exactWeight += w;
        exactCount++;
        matchDetails.push({ q, userAns, matched: "exact", weight: w });
      } else {
        // Check if the user's answer's archetype scores include this perfume's archetype
        const opt = q.options[userAns];
        const archSlug = perfumeArchetypeSlug(p);
        if (opt && archSlug && opt.scores.includes(archSlug)) {
          nearWeight += w * 0.5;
          nearCount++;
          matchDetails.push({ q, userAns, matched: "near", weight: w });
        }
      }
    }
    const rawScore = exactWeight + nearWeight - dislikedPenalty;
    const similarity = Math.max(0, rawScore / totalWeight); // 0..1, floor at 0
    return { perfume: p, exactCount, nearCount, exactWeight, nearWeight, dislikedPenalty, rawScore, similarity, matchDetails };
  });
  // Sort by similarity (desc), then by exactCount (desc), then by tiebreaker
  scored.sort((a, b) => {
    if (b.similarity !== a.similarity) return b.similarity - a.similarity;
    if (b.exactCount !== a.exactCount) return b.exactCount - a.exactCount;
    // Tiebreaker: deterministic hash for variety
    const aHash = (a.perfume.slug + JSON.stringify(answers)).split("").reduce((h, c) => ((h << 5) - h + c.charCodeAt(0)) | 0, 0);
    const bHash = (b.perfume.slug + JSON.stringify(answers)).split("").reduce((h, c) => ((h << 5) - h + c.charCodeAt(0)) | 0, 0);
    return (aHash & 0xff) - (bHash & 0xff);
  });
  // === Diversify the shortlist ===
  // A naive top-3 can hand back three near-identical perfumes from the same
  // archetype (e.g. three "velvet-noir" perfumes), which defeats the point of
  // offering choice. Prefer the single best perfume per archetype first, then
  // only fall back to a second perfume from an already-used archetype if there
  // aren't three distinct archetypes available.
  function archetypeOf(p) {
    return perfumeArchetypeSlug(p);
  }
  const shortlist = [];
  const usedArchetypes = new Set();
  for (const entry of scored) {
    if (shortlist.length >= 3) break;
    const arch = archetypeOf(entry.perfume);
    if (!usedArchetypes.has(arch)) {
      shortlist.push(entry);
      usedArchetypes.add(arch);
    }
  }
  if (shortlist.length < 3) {
    for (const entry of scored) {
      if (shortlist.length >= 3) break;
      if (!shortlist.includes(entry)) shortlist.push(entry);
    }
  }
  // === Build a match score per shortlisted entry (target: 82-98%, always above 80%) ===
  // Dominance is measured against the NEXT entry in the full similarity ranking
  // (not just the shortlist), so the percentages still reflect true separation.
  function scoreFor(entry, idx) {
    const nextOverallIdx = scored.indexOf(entry) + 1;
    const nextOverall = scored[nextOverallIdx];
    const sim = entry.similarity;
    let ms;
    if (sim >= 0.7) ms = 92 + Math.round(sim * 6);
    else if (sim >= 0.5) ms = 87 + Math.round((sim - 0.5) * 12);
    else if (sim >= 0.3) ms = 84 + Math.round((sim - 0.3) * 25);
    else ms = 82 + (entry.exactCount % 6);
    if (nextOverall) {
      const dominance = entry.similarity - nextOverall.similarity;
      if (dominance > 0.2) ms = Math.min(ms + 3, 98);
      else if (dominance > 0.1) ms = Math.min(ms + 1, 98);
    }
    if (entry.dislikedPenalty > 0) ms = Math.max(82, ms - Math.round(entry.dislikedPenalty * 3));
    ms = Math.max(82, Math.min(98, ms));
    // Keep the 3 options visibly ordered (1st ≥ 2nd ≥ 3rd) even when raw scores
    // land close together, so the ranking reads clearly to the customer.
    if (idx > 0) ms = Math.min(ms, prevScore - 1);
    prevScore = ms;
    return ms;
  }
  function reasonsFor(entry) {
    const sortedDetails = [...entry.matchDetails].sort((a, b) => b.weight - a.weight);
    const reasons = [];
    for (const md of sortedDetails) {
      if (md.matched === "exact" || md.matched === "near") {
        const opt = md.q.options[md.userAns];
        reasons.push({ question: { en: md.q.qEn, ar: md.q.qAr }, answer: { en: opt.lEn, ar: opt.lAr }, category: md.q.categoryEn });
      }
      if (reasons.length >= 4) break;
    }
    return reasons;
  }
  let prevScore = 99;
  const options = shortlist.map((entry, idx) => ({
    perfume: entry.perfume,
    matchScore: scoreFor(entry, idx),
    topReasons: reasonsFor(entry),
  }));
  return { perfume: options[0].perfume, matchScore: options[0].matchScore, topReasons: options[0].topReasons, options };
}

// Fallback archetype-based scoring (used only if no user perfumes exist)
function recommendArchetypeFallback(answers, perfumes) {
  const byArchetype = {};
  for (const p of perfumes) {
    let arch = p.isArchetype ? p.slug : perfumeArchetypeSlug(p);
    if (!byArchetype[arch]) byArchetype[arch] = [];
    byArchetype[arch].push(p);
  }
  const scores = {};
  for (const arch of Object.keys(byArchetype)) scores[arch] = 0;
  let answeredCount = 0;
  for (const q of QUIZ_QUESTIONS) {
    const idx = answers[q.id];
    if (idx === undefined) continue;
    const opt = q.options[idx];
    if (!opt) continue;
    answeredCount++;
    for (const pid of opt.scores) {
      if (scores[pid] !== undefined) scores[pid] += 1;
    }
  }
  const scoreEntries = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const topArchetypes = scoreEntries.slice(0, 3).map(e => e[0]);
  if (topArchetypes.length === 0) topArchetypes.push(Object.keys(byArchetype)[0] || "");
  function reasonsForArch(arch) {
    const reasons = [];
    for (const q of QUIZ_QUESTIONS) {
      const idx = answers[q.id];
      if (idx === undefined) continue;
      const opt = q.options[idx];
      if (!opt) continue;
      if (opt.scores.includes(arch)) reasons.push({ question: { en: q.qEn, ar: q.qAr }, answer: { en: opt.lEn, ar: opt.lAr }, category: q.categoryEn });
      if (reasons.length >= 4) break;
    }
    return reasons;
  }
  let prevScore = 99;
  const options = topArchetypes.map((arch, idx) => {
    const candidates = byArchetype[arch] || [];
    const perfume = candidates[0] || perfumes[0];
    const rank = scores[arch] || 0;
    let ms = answeredCount > 0 ? Math.min(82 + (rank % 14), 98) : 0;
    if (idx > 0) ms = Math.min(ms, prevScore - 1);
    prevScore = ms;
    return { perfume, matchScore: ms, topReasons: reasonsForArch(arch) };
  });
  return { perfume: options[0].perfume, matchScore: options[0].matchScore, topReasons: options[0].topReasons, options };
}

  const map = {
    "from-amber-100": "#fef3c7", "via-rose-50": "#fff1f2", "to-white": "#ffffff",

    "from-sky-100": "#e0f2fe", "via-cyan-50": "#ecfeff",

    "from-stone-50": "#fafaf9", "via-white": "#ffffff", "to-stone-100": "#f5f5f4",
  };
  // Build a gradient from the first two color stops
  const stops = [];
  if (g.includes("from-amber-100")) stops.push("#fef3c7");
  if (g.includes("from-rose-100")) stops.push("#ffe4e6");
  if (g.includes("from-stone-900")) stops.push("#1c1917");
  if (g.includes("from-stone-950")) stops.push("#0c0a09");
  if (g.includes("from-stone-50")) stops.push("#fafaf9");
  if (g.includes("from-orange-100")) stops.push("#ffedd5");
  if (g.includes("from-sky-100")) stops.push("#e0f2fe");
  if (g.includes("via-rose-50")) stops.push("#fff1f2");
  if (g.includes("via-pink-50")) stops.push("#fdf2f8");
  if (g.includes("via-stone-800")) stops.push("#292524");
  if (g.includes("via-stone-100")) stops.push("#f5f5f4");
  if (g.includes("via-amber-100")) stops.push("#fef3c7");
  if (g.includes("via-cyan-50")) stops.push("#ecfeff");
  if (g.includes("via-white")) stops.push("#ffffff");
  if (g.includes("via-rose-950")) stops.push("#4c0519");
  if (g.includes("to-white")) stops.push("#ffffff");
  if (g.includes("to-amber-950")) stops.push("#451a03");
  if (g.includes("to-rose-100")) stops.push("#ffe4e6");
  if (g.includes("to-stone-100")) stops.push("#f5f5f4");
  if (g.includes("to-stone-200")) stops.push("#e7e5e4");
  if (stops.length === 0) stops.push("#f5f5f4", "#ffffff");
  if (stops.length === 1) stops.push("#ffffff");
  return `linear-gradient(to bottom right, ${stops.join(", ")})`;
}

// ====================== RENDER HELPERS ======================
function el(tag, props, ...children) {
  const e = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "className") e.className = v;
      else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
      else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "html") e.innerHTML = v;
      else if (k === "disabled") e.disabled = true;
      else if (k === "checked") e.checked = Boolean(v);
      else if (k === "selected") { if (v) e.selected = true; }
      else if (k === "value") {
        if (tag === "option" || tag === "input" || tag === "textarea" || tag === "select") e.value = v;
        else e.setAttribute(k, v);
      }
      else e.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c === null || c === undefined || c === false) continue;
    if (typeof c === "string" || typeof c === "number") e.appendChild(document.createTextNode(String(c)));
    else if (Array.isArray(c)) c.forEach(x => x && e.appendChild(x));
    else e.appendChild(c);
  }
  return e;
}

function icon(svgPath, size = 16) {
  return el("span", { className: "inline-flex", style: { width: size + "px", height: size + "px" } ,

}

  /* Price */

  /* Footer */

  .footer-contact { font-size: 8pt; color: #1C1712; letter-spacing: 0.1em; }

  .footer-date { font-size: 7pt; color: #6B6154; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 2mm; opacity: 0.6; }

  /* Print */
  @media print {
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .no-print { display: none !important; }
  }
  .print-bar { position: fixed; top: 0; left: 0; right: 0; background: #1C1712; color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; font-family: 'Inter', sans-serif; z-index: 100; }
  .print-bar button { background: #85653A; color: #fff; border: none; padding: 8px 20px; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; }
  .print-bar button:hover { background: #6d5230; }
  .print-bar .hint { font-size: 10px; opacity: 0.7; }
  @media print { .print-bar { display: none; } .page { padding-top: 12mm; } }

  /* Sealed Wish section */
  .wish-section { margin: 6mm 0; padding: 6mm; background: #F5F1ED; border: 1px solid #85653A; text-align: center; }
  .wish-label { font-size: 7pt; color: #85653A; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 3mm; }
  .wish-text { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 13pt; line-height: 1.6; color: #1C1712; }
  [dir="rtl"] .wish-text { font-family: 'Noto Naskh Arabic', serif; }
</style>
</head>

// ====================== RENDER: APP ======================
function render() {
  const root = document.getElementById("root");
  root.innerHTML = "";
  // On the language-selection screen, hide header/footer for a clean welcome
  if (phase === "lang-select") {
    const wrapper = el("div", { className: "flex flex-col min-h-screen" },
      renderMain(),
      renderToasts()
    );
    if (adminOpen) wrapper.appendChild(renderAdminModal());
    if (wishModalOpen) wrapper.appendChild(renderWishModal());
    root.appendChild(wrapper);
    return;
  }
  const wrapper = el("div", { className: "flex flex-col min-h-screen" },
    renderHeader(),
    renderMain(),
    renderToasts()
  );
  if (adminOpen) wrapper.appendChild(renderAdminModal());
  if (wishModalOpen) wrapper.appendChild(renderWishModal());
  root.appendChild(wrapper);
}

function renderHeader() {
  const nav = el("nav", { className: "flex items-center gap-4" });
  nav.appendChild(el("a", { href: state.brand.instagram, target: "_blank", rel: "noopener noreferrer", className: "text-muted-foreground hover:text-foreground", "aria-label": "Instagram" }, icon(ICONS.instagram, 16)));
  if (lang === "en") {
    nav.appendChild(el("span", { className: "hidden sm:inline font-sans text-[10px] uppercase tracking-wide-luxe text-muted-foreground" }, t(state.brand.taglineEn ? { en: state.brand.taglineEn, ar: state.brand.taglineAr } : { en: "", ar: "" })));
  } else {
    nav.appendChild(el("span", { className: "hidden sm:inline font-sans text-[10px] uppercase tracking-wide-luxe text-muted-foreground" }, state.brand.taglineAr));
  }
  // Language toggle
  const langBtn = el("button", {
    type: "button",
    onClick: () => { lang = lang === "en" ? "ar" : "en"; applyLang(); render(); },
    className: "flex items-center gap-2 border border-border bg-transparent px-3 h-9 font-sans text-[11px] uppercase tracking-wide-luxe text-foreground hover:border-primary hover:text-primary rounded-none",
    "aria-label": "Toggle language",
  }, icon(ICONS.languages, 14), document.createTextNode(lang === "en" ? "العربية" : "English"));
  nav.appendChild(langBtn);
  // Admin button
  const adminBtn = el("button", {
    type: "button",
    onClick: () => { adminOpen = true; render(); },
    className: "flex items-center justify-center w-9 h-9 border border-border bg-transparent text-muted-foreground hover:border-primary hover:text-primary rounded-none",
    "aria-label": "Admin settings",
  }, icon(ICONS.settings, 16));
  nav.appendChild(adminBtn);

  return el("header", { className: "sticky top-0 z-40 border-b border-border/60 bg-background/80 backdrop-blur-md" },
    el("div", { className: "mx-auto flex h-16 max-w-6xl items-center justify-between px-6" },
      // Design fix: previously the header showed only the brand name as text, while the
      // landing page showed the brand logo — an inconsistency that made the welcome and
      // the rest of the app feel like two different products. Now both display the logo
      // beside the name, so the brand reads as one continuous identity throughout.
      el("div", { className: "flex items-center gap-3" },
        el("img", {
          src: state.brand.logoUrl,
          alt: state.brand.name + " logo",
          className: "h-10 w-auto object-contain",
          style: { maxHeight: "40px" }
        }),
        el("span", { className: "latin-serif text-xl tracking-wide text-foreground cursor-default" }, state.brand.name)
      ),
      nav
    )
  );
}

function renderMain() {
  const main = el("main", { className: "flex-1" });
  if (revealing) {
    main.appendChild(renderRevealOverlay());
  }
  if (phase === "lang-select") {
    main.appendChild(renderLangSelect());
    // No footer on the language selection screen
    return main;
  }
  else if (phase === "landing") main.appendChild(renderLanding());
  else if (phase === "gender-select") main.appendChild(renderGenderSelect());
  else if (phase === "birthdate") main.appendChild(renderBirthdate());
  else if (phase === "couple-names") main.appendChild(renderCoupleNames());
  else if (phase === "couple-quiz-intro") main.appendChild(renderCoupleQuizIntro());
  else if (phase === "couple-quiz") main.appendChild(renderCoupleQuiz());
  else if (phase === "couple-result" && coupleResult) main.appendChild(renderCoupleResult());
  else if (phase === "quiz") main.appendChild(renderQuiz());
  else if (phase === "result" && result) main.appendChild(renderResult());
  main.appendChild(renderFooter());
  return main;
}

function renderLangSelect() {
  const section = el("section", { className: "relative flex min-h-screen items-center justify-center bg-ink px-6 py-16" });
  // Ambient warmth — a single quiet gradient, not scattered decoration
  section.appendChild(el("div", { className: "pointer-events-none absolute inset-0 opacity-70", style: { background: "radial-gradient(ellipse at 50% 0%, rgba(201,169,97,0.10) 0%, transparent 55%)" } }));
  // BUG FIX: previously the lang-select screen had no admin button (the header was hidden

  section.appendChild(el("button", {
    type: "button",
    onClick: () => { adminOpen = true; render(); },
    className: "fixed top-4 end-4 z-50 flex items-center justify-center w-9 h-9 border border-ink-foreground/20 bg-transparent text-ink-foreground hover:border-ink-accent hover:text-ink-accent rounded-none transition-colors",

  const content = el("div", { className: "relative mx-auto max-w-md text-center w-full" });
  // Logo (centered) — uses mix-blend-mode: screen so any white/light background in the
  // logo image disappears into the dark page background, while the colored/dark parts
  // of the logo display correctly. This works for both colored JPEG logos and simple
  // white-on-transparent logos. (Previously used `filter: brightness(0) invert(1)`
  // which forced everything to solid white — that broke colored logos.)
  content.appendChild(el("div", { className: "mx-auto mb-12 h-28 flex items-center justify-center" },
    el("img", { src: state.brand.logoUrl, alt: state.brand.name + " logo", className: "h-full w-auto object-contain mx-auto block", style: { maxWidth: "180px", mixBlendMode: "screen", opacity: "0.95", filter: "drop-shadow(0 0 12px rgba(201,169,97,0.3))" } })
  ));
  // Welcome heading
  const heading = el("div", { className: "mb-10" });

  heading.appendChild(el("p", { className: "mt-6 font-sans text-sm text-ink-foreground opacity-60" }, t({ en: "Please select your language", ar: "من فضلك اختر لغتك" })));
  content.appendChild(heading);
  // Language buttons
  const btns = el("div", { className: "space-y-3" });
  // English button
  btns.appendChild(el("button", {
    type: "button",
    onClick: () => { lang = "en"; applyLang(); phase = "landing"; render(); window.scrollTo({ top: 0, behavior: "smooth" }); },
    className: "group flex w-full items-center justify-between border border-ink-foreground/20 bg-transparent px-8 py-6 text-start transition-all duration-300 hover:border-ink-accent hover:bg-ink-foreground/5 rounded-none",
  },
    el("div", { className: "flex items-center gap-4" },
      el("span", { className: "latin-serif text-2xl text-ink-foreground" }, "EN"),
      el("div", {},
        el("p", { className: "latin-serif text-lg text-ink-foreground" }, "English"),
        el("p", { className: "font-sans text-[11px] text-ink-foreground opacity-50" }, "Continue in English")
      )
    ),
    el("span", { className: "text-ink-foreground opacity-50 group-hover:text-ink-accent group-hover:opacity-100 transition-colors" }, icon(ICONS.arrowRight, 20))
  ));
  // Arabic button
  btns.appendChild(el("button", {
    type: "button",
    onClick: () => { lang = "ar"; applyLang(); phase = "landing"; render(); window.scrollTo({ top: 0, behavior: "smooth" }); },
    className: "group flex w-full items-center justify-between border border-ink-foreground/20 bg-transparent px-8 py-6 text-start transition-all duration-300 hover:border-ink-accent hover:bg-ink-foreground/5 rounded-none",
  },
    el("div", { className: "flex items-center gap-4" },
      el("span", { className: "font-arabic-display text-2xl text-ink-foreground" }, "ع"),
      el("div", {},
        el("p", { className: "font-arabic-display text-lg text-ink-foreground" }, "العربية"),
        el("p", { className: "font-sans text-[11px] text-ink-foreground opacity-50" }, "المتابعة بالعربية")
      )
    ),
    el("span", { className: "text-ink-foreground opacity-50 group-hover:text-ink-accent group-hover:opacity-100 transition-colors" }, icon(ICONS.arrowRight, 20))
  ));
  content.appendChild(btns);
  // Footer note
  content.appendChild(el("p", { className: "mt-12 font-sans text-[10px] uppercase tracking-luxe text-ink-foreground opacity-30" }, t({ en: "You can change language anytime from the header", ar: "تقدر تغير اللغة في أي وقت من الأعلى" })));
  section.appendChild(content);

// Helper: month + day dropdowns for couple birthdates (no year)
function renderMonthDayDropdowns(storedValue, onChange) {
  let preMonth = "", preDay = "";
  if (storedValue) {
    const parts = storedValue.split("-");
    if (parts.length === 3) { preMonth = parts[1]; preDay = parts[2]; }
    else if (parts.length === 2) { preMonth = parts[0]; preDay = parts[1]; }
  }
  const wrap = el("div", { className: "grid grid-cols-2 gap-2" });
  const monthNames = lang === "ar"
    ? ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"]
    : ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const monthSelect = el("select", { className: "rounded-none h-11 px-2 w-full" });
  monthSelect.appendChild(el("option", { value: "" }, "—"));
  monthNames.forEach((name, i) => {
    const v = String(i + 1).padStart(2, "0");
    monthSelect.appendChild(el("option", { value: v, selected: preMonth === v }, name));
  });
  const daySelect = el("select", { className: "rounded-none h-11 px-2 w-full" });
  daySelect.appendChild(el("option", { value: "" }, "—"));
  for (let d = 1; d <= 31; d++) {
    const v = String(d).padStart(2, "0");
    daySelect.appendChild(el("option", { value: v, selected: preDay === v }, String(d)));
  }
  function update() {
    const m = monthSelect.value;
    const d = daySelect.value;
    onChange(m && d ? `2000-${m}-${d}` : "");
  }
  monthSelect.addEventListener("change", update);
  daySelect.addEventListener("change", update);
  wrap.appendChild(monthSelect);
  wrap.appendChild(daySelect);
  return wrap;
}

// ====================== COUPLE: COMPATIBILITY COMPUTATION ======================
function computeCoupleResult() {
  // In couple mode: partner 1 = male, partner 2 = female
  let rec1 = recommendPerfume(coupleAnswers.p1, state.perfumes, "male");
  let rec2 = recommendPerfume(coupleAnswers.p2, state.perfumes, "female");
  // Normalize each partner's ranked options into a clean list, guaranteeing 90%+ scores
  // (we recommended these → they should all read as strong matches, not just the top one)
  function normalize(rec) {
    const opts = (rec.options && rec.options.length > 0) ? rec.options : [{ perfume: rec.perfume, matchScore: rec.matchScore, topReasons: rec.topReasons }];
    return opts.map(o => ({ ...o, matchScore: o.matchScore < 90 ? 90 + (o.matchScore % 8) : o.matchScore }));
  }
  let opts1 = normalize(rec1);
  let opts2 = normalize(rec2);
  // Ensure the two partners' TOP picks are never the same perfume, even if their answers matched
  if (opts1[0].perfume.id === opts2[0].perfume.id) {
    if (opts2[1]) {
      opts2 = [opts2[1], opts2[0], ...opts2.slice(2)]; // promote partner 2's 2nd choice to 1st
    } else {
      const femalePerfumes = state.perfumes.filter(p => !p.isArchetype && p.profile && (p.gender === "female" || p.gender === "unisex"));
      const altCandidate = femalePerfumes.find(p => p.id !== opts1[0].perfume.id);
      if (altCandidate) opts2 = [{ perfume: altCandidate, matchScore: Math.max(90, opts2[0].matchScore - 3), topReasons: opts2[0].topReasons }, ...opts2];
    }
  }
  // Each partner gets their 2 closest-matching perfumes to choose between
  const p1Picks = opts1.slice(0, 2);
  const p2Picks = opts2.slice(0, 2);
  // Keep rec1/rec2 pointing at each partner's PRIMARY pick (post collision-avoidance) for the
  // compatibility story/insight generated below.
  rec1 = p1Picks[0];
  rec2 = p2Picks[0];
  // Compatibility: count matching answers across the 7 questions
  let matches = 0;
  let total = 0;
  const sharedAnswers = [];
  const differentAnswers = [];
  for (const q of COUPLE_QUIZ_QUESTIONS) {
    const a1 = coupleAnswers.p1[q.id];
    const a2 = coupleAnswers.p2[q.id];
    if (a1 === undefined || a2 === undefined) continue;
    total++;
    if (a1 === a2) {
      matches++;
      sharedAnswers.push({ question: { en: q.qEn, ar: q.qAr }, answer: { en: q.options[a1].lEn, ar: q.options[a1].lAr }, category: q.categoryEn });
    } else {
      differentAnswers.push({
        question: { en: q.qEn, ar: q.qAr },
        p1Answer: { en: q.options[a1].lEn, ar: q.options[a1].lAr },
        p2Answer: { en: q.options[a2].lEn, ar: q.options[a2].lAr },
      });
    }
  }
  const compatibilityScore = total > 0 ? Math.round((matches / total) * 100) : 0;
  // Dynamic label
  let compatLabel;
  if (compatibilityScore >= 70) compatLabel = UI.compatHigh;
  else if (compatibilityScore >= 40) compatLabel = UI.compatMedium;
  else compatLabel = UI.compatLow;
  // Generate story
  const story = generateCoupleStory(rec1.perfume, rec2.perfume, compatibilityScore, rec1, rec2);
  // Generate personality compatibility insight (based on zodiac, framed as AI analysis)
  const personalityInsight = generateZodiacInsight(coupleBirthdates.p1, coupleBirthdates.p2);
  return {
    p1: { ...p1Picks[0], name: coupleNames.p1 },
    p1Alt: p1Picks[1] ? { ...p1Picks[1], name: coupleNames.p1 } : null,
    p2: { ...p2Picks[0], name: coupleNames.p2 },
    p2Alt: p2Picks[1] ? { ...p2Picks[1], name: coupleNames.p2 } : null,
    compatibilityScore,
    compatLabel,
    sharedAnswers,
    differentAnswers,
    story,
    personalityInsight,
  };
}

// Same idea as buildMatchNarrative, but for what a couple answered the same way — turns the
// raw "shared answers" list into one sentence instead of a bullet dump.
function buildSharedNarrative(sharedAnswers) {
  if (!sharedAnswers || sharedAnswers.length === 0) return "";
  const isAr = lang === "ar";
  const personalityOnes = sharedAnswers.filter(r => r.category === "Personality" || r.category === "Mood");
  const chosen = personalityOnes.length > 0 ? personalityOnes : sharedAnswers;
  const isPersonal = personalityOnes.length > 0;
  const trait1 = chosen[0] ? t(chosen[0].answer) : "";
  const trait2 = chosen[1] ? t(chosen[1].answer) : "";
  if (!trait1) return "";
  const n1 = coupleNames.p1, n2 = coupleNames.p2;
  const variant = (n1.length + n2.length + sharedAnswers.length) % 2;
  const low1 = isAr ? trait1 : trait1.charAt(0).toLowerCase() + trait1.slice(1);
  const low2 = trait2 ? (isAr ? trait2 : trait2.charAt(0).toLowerCase() + trait2.slice(1)) : "";
  if (isAr) {
    if (isPersonal) {
      return variant === 0
        ? (trait2 ? `${n1} و${n2} الاتنين وصفوا نفسهم بـ${low1} و${low2} من غير ما يتفقوا قبلها — نوع التطابق اللي مش بيتخطط.` : `${n1} و${n2} الاتنين شافوا نفسهم ${low1} — تطابق بسيط بس حقيقي.`)
        : (trait2 ? `مفاجأة صغيرة إن ${n1} و${n2} وصلوا لنفس الإجابة في كونهم ${low1} و${low2} — من غير ما يتناقشوا.` : `${n1} و${n2} اتفقوا من غير كلام على إنهم ${low1}.`);
    }
    return `${n1} و${n2} الاتنين مالوا لنفس الاختيار: ${low1}${trait2 ? " و" + low2 : ""} — تفضيل مشترك واضح بينكم.`;
  }
  if (isPersonal) {
    return variant === 0
      ? (trait2 ? `${n1} and ${n2} both described themselves as ${low1} and ${low2} — without comparing notes first. That's the kind of match that isn't planned.` : `${n1} and ${n2} both see themselves as ${low1} — small, but real.`)

  }
  return `${n1} and ${n2} both leaned the same way: ${low1}${trait2 ? " and " + low2 : ""} — a clear shared preference between you.`;
}

      `${n1} and ${n2} — a beautiful balance between you both. ${trait1 && trait2 ? `${trait1} on one side, ${trait2} on the other` : "Your differences"} are exactly what makes the relationship intriguing, and your scents (${fam1} and ${fam2}) tell a rich love story.`,
      `${n1} and ${n2} aren't mirror images of each other, and that's exactly what makes this worth telling. ${fam1} and ${fam2} look different on paper, but together they make something neither would reach alone.`,
      `There's a quiet balance between ${n1} and ${n2} — each steadying the other exactly where it's needed. ${fam1} and ${fam2} aren't the same melody, but they play well together.`,
    ];
    return templates[variant];
  }
  const templates = isAr ? [
    `${n1} و${n2} — تباين آسر. الاتنين فيكم عوالم مختلفة، بس ده بالظبط اللي بيخلق الجذب بينكم. عطر ${fam1} وعطر ${fam2} بيتكملوا بطريقة فنية، زي لوحتين معلّقين جنب بعض في معرض.`,
    `${n1} و${n2} بيثبتوا إن الجذب مش دايماً بيبقى من التشابه — أحياناً بيبقى من المسافة اللي بتخلي كل واحد يفضل فضولي عن التاني. ${fam1} و${fam2} صوتين مختلفين، بس بيعملوا موسيقى غريبة وحلوة مع بعض.`,
    `بين ${n1} و${n2} مسافة حقيقية، لكنها مش عيب — دي المساحة اللي بيكبروا فيها مع بعض. ${fam1} وعكسه تقريباً ${fam2}، بس التباين ده نفسه هو الحكاية.`,
  ] : [
    `${n1} and ${n2} — a fascinating contrast. You are two different worlds, but that's exactly what creates the magnetism between you. ${fam1} and ${fam2} complement each other artfully, like two paintings hung side by side in a gallery.`,
    `${n1} and ${n2} prove attraction doesn't always come from sameness — sometimes it's the distance that keeps you curious about each other. ${fam1} and ${fam2} are different voices, making an odd, good kind of music together.`,
    `There's real distance between ${n1} and ${n2}, but it isn't a flaw — it's the space you grow into together. ${fam1} and its near-opposite, ${fam2}, are exactly what makes this story worth telling.`,
  ];
  return templates[variant];
}

  }

        coupleAnswers = { p1: {}, p2: {} };

    }, el("span", { className: "me-2" }, icon(ICONS.rotateCcw, 16)), document.createTextNode(t(UI.retakeCouple)))
  ));
  section.appendChild(wrap);
  return section;
}

function renderCouplePerfumeCard(primary, alt, partnerNum) {
  const partnerKey = partnerNum === 1 ? "p1" : "p2";
  const options = alt ? [primary, alt] : [primary];
  const selectedIdx = Math.min(coupleSelected[partnerKey] || 0, options.length - 1);
  const rec = options[selectedIdx];
  const { perfume, matchScore } = rec;
  const name = partnerNum === 1 ? coupleNames.p1 : coupleNames.p2;
  const partnerGender = partnerNum === 1 ? "male" : "female";
  const partnerImg = getPerfumeImage(perfume, partnerGender);
  const card = el("div", { className: "rounded-sm border border-border bg-card overflow-hidden" });
  // Image area
  card.appendChild(el("div", { className: "relative h-64", style: { background: gradientClass(perfume.gradient) } },
    partnerImg ? el("img", { src: partnerImg, alt: perfume.name, className: "absolute inset-0 h-full w-full object-cover" }) : null,
    el("div", { className: "absolute inset-0 flex items-center justify-center" },
      el("div", { className: "text-center" },
        el("p", { className: "font-sans text-[10px] uppercase tracking-luxe text-white/80 mb-2" }, t(partnerNum === 1 ? UI.partner1Scent : UI.partner2Scent)),
        el("p", { className: "latin-serif text-2xl text-white" }, name)
      )
    )
  ));
  // Content
  const content = el("div", { className: "p-6" });
  // 2-option toggle — lets this partner see their 2 closest-matching perfumes, independent
  // of the other partner's card
  if (options.length > 1) {
    const toggleRow = el("div", { className: "mb-4 grid grid-cols-2 gap-2" });
    options.forEach((opt, i) => {
      const isActive = i === selectedIdx;
      toggleRow.appendChild(el("button", {
        type: "button",
        onClick: () => { coupleSelected[partnerKey] = i; render(); },
        className: "rounded-sm border px-3 py-2 text-center transition-colors " + (isActive ? "border-primary bg-secondary/50" : "border-border hover:border-primary/40"),
      },
        el("p", { className: "font-sans text-[9px] uppercase tracking-wide-luxe text-muted-foreground" }, t(i === 0 ? UI.closestMatch : UI.secondMatch)),
        el("p", { className: "latin-serif bidi-ltr text-sm text-foreground" }, displayName(opt.perfume, partnerGender) + " · " + opt.matchScore + "%")
      ));
    });
    content.appendChild(toggleRow);
  }
  content.appendChild(el("p", { className: "font-sans text-[10px] uppercase tracking-luxe text-primary" }, t({ en: perfume.familyEn, ar: perfume.familyAr }) + " · " + t({ en: perfume.timeOfDayEn, ar: perfume.timeOfDayAr })));
  content.appendChild(el("h3", { className: "latin-serif bidi-ltr mt-2 text-3xl font-normal text-foreground" }, displayName(perfume, partnerGender)));
  content.appendChild(el("p", { className: "mt-1 font-serif text-sm italic text-muted-foreground" }, t({ en: perfume.taglineEn, ar: perfume.taglineAr })));
  content.appendChild(el("p", { className: "mt-3 font-sans text-xs text-foreground/80 leading-relaxed" }, t({ en: perfume.descriptionEn, ar: perfume.descriptionAr })));
  // Notes
  content.appendChild(el("div", { className: "mt-4 space-y-1 border-t border-border pt-3" },
    el("p", { className: "font-sans text-[9px] uppercase tracking-wide-luxe text-muted-foreground" }, t({ en: perfume.topNotesEn, ar: perfume.topNotesAr })),
    el("p", { className: "font-sans text-[9px] uppercase tracking-wide-luxe text-muted-foreground" }, t({ en: perfume.heartNotesEn, ar: perfume.heartNotesAr })),
    el("p", { className: "font-sans text-[9px] uppercase tracking-wide-luxe text-muted-foreground" }, t({ en: perfume.baseNotesEn, ar: perfume.baseNotesAr }))
  ));
  // Match + price
  content.appendChild(el("div", { className: "mt-4 flex items-center justify-between border-t border-border pt-3" },
    el("div", {},
      el("span", { className: "font-sans text-[10px] uppercase tracking-wide-luxe text-muted-foreground" }, t(UI.matchScore) + " "),
      el("span", { className: "latin-serif text-lg text-primary" }, matchScore + "%")
    ),
    el("div", { className: "text-end" },
      el("p", { className: "latin-serif text-lg text-foreground" }, formatPrice(perfume.price)),
      el("p", { className: "font-sans text-[9px] uppercase tracking-wide-luxe text-muted-foreground" }, perfume.size)
    )
  ));
  card.appendChild(content);
  return card;
}

  const p1Active = (cr.p1Alt && coupleSelected.p1 === 1) ? cr.p1Alt : cr.p1;
  const p2Active = (cr.p2Alt && coupleSelected.p2 === 1) ? cr.p2Alt : cr.p2;
  const isAr = lang === "ar";
  const dir = isAr ? "rtl" : "ltr";
  const fontFamily = isAr ? "'Noto Naskh Arabic', 'Cairo', serif" : "'Fraunces', 'Inter', serif";

  const partnerCard = (rec, name, partnerNum) => {
    const p = rec.perfume;

    return `

      <div class="partner-price">${formatPrice(p.price)} · ${p.size}</div>
    </div>`;

// Sound effect using Web Audio API (no external file needed)
function playRevealSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    // A soft, luxurious chime — three notes ascending (C5, E5, G5)
    const notes = [523.25, 659.25, 783.99];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + i * 0.15);
      gain.gain.linearRampToValueAtTime(0.15, now + i * 0.15 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 1.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.15);
      osc.stop(now + i * 0.15 + 1.5);
    });
    // Soft bass pad underneath
    const bass = ctx.createOscillator();
    const bassGain = ctx.createGain();
    bass.type = "triangle";
    bass.frequency.value = 130.81; // C3
    bassGain.gain.setValueAtTime(0, now);
    bassGain.gain.linearRampToValueAtTime(0.08, now + 0.1);
    bassGain.gain.exponentialRampToValueAtTime(0.001, now + 2);
    bass.connect(bassGain);
    bassGain.connect(ctx.destination);
    bass.start(now);
    bass.stop(now + 2);
  } catch (e) {
    // Audio not supported — silently skip
  }
}

    el("div", { className: "absolute inset-0 flex items-center justify-center", style: { color: "#85653A" } }, icon(ICONS.sparkles2, 40))
  ));

  // Status text — changes through 5 phases over 20 seconds
  const statusText = el("p", { className: "font-serif text-2xl italic mb-6", style: { color: "#E8C4A0", animation: "shimmerText 2s ease-in-out infinite", minHeight: "1.5em" } }, t(UI.composing));
  content.appendChild(statusText);

  // Progress bar — fills from 0% to 100% over 20 seconds
  const progressWrap = el("div", { className: "mx-auto", style: { width: "320px", maxWidth: "80vw" } });
  const progressTrack = el("div", { className: "relative h-1 rounded-full overflow-hidden", style: { background: "rgba(255,255,255,0.08)" } });
  const progressFill = el("div", { className: "absolute inset-y-0 left-0 rounded-full", style: {
    width: "0%",
    background: "linear-gradient(to right, #85653A, #C9A961, #E8C4A0)",
    transition: "width 0.3s ease-out",
    boxShadow: "0 0 12px rgba(201,169,97,0.6)",
  } });
  progressTrack.appendChild(progressFill);
  progressWrap.appendChild(progressTrack);
  // Percentage + phase label
  const metaRow = el("div", { className: "mt-3 flex items-center justify-between font-sans text-[10px] uppercase tracking-wide-luxe" },
    el("span", { className: "text-ink-foreground opacity-50" }, t({ en: "Analyzing", ar: "بنحلل" })),
    el("span", { className: "text-ink-accent" }, "0%")
  );
  progressWrap.appendChild(metaRow);
  content.appendChild(progressWrap);

  // Gold accent line
  content.appendChild(el("div", { className: "mx-auto mt-8 h-px w-24", style: { background: "linear-gradient(to right, transparent, #85653A, transparent)" } }));

  overlay.appendChild(content);

  // === Animate the progress bar over 20 seconds, with 5 status phases ===
  // Each phase is a different "analysis" message so the customer feels like
  // real work is happening, not just a timer. The phases are bilingual.
  const phases = [
    { start: 0,  end: 20,  en: "Analyzing your personality...",     ar: "بنحلل شخصيتك..." },
    { start: 20, end: 40,  en: "Matching your scent preferences...", ar: "بنطابق تفضيلاتك العطرية..." },
    { start: 40, end: 60,  en: "Reading your zodiac traits...",      ar: "بنحلل صفات برجك..." },
    { start: 60, end: 85,  en: "Composing your signature scent...",   ar: "بنألف عطرك المميز..." },
    { start: 85, end: 101, en: "Almost there...",                     ar: "اقتربنا..." },
  ];
  const startTime = Date.now();
  const DURATION = 20000; // 20 seconds — gives the feeling of real analysis

  // Update progress every frame (~60fps). requestAnimationFrame pauses when
  // the tab is hidden, so the bar won't run while the user is on another tab.
  function tick() {
    const elapsed = Date.now() - startTime;
    const progress = Math.min(100, (elapsed / DURATION) * 100);
    progressFill.style.width = progress + "%";
    metaRow.lastElementChild.textContent = Math.round(progress) + "%";
    // Update status text based on current phase
    const phase = phases.find(p => progress >= p.start && progress < p.end);
    if (phase) {
      const newText = lang === "ar" ? phase.ar : phase.en;
      if (statusText.textContent !== newText) statusText.textContent = newText;
    }
    if (progress < 100) {
      requestAnimationFrame(tick);
    }
  }
  requestAnimationFrame(tick);

  return overlay;
}

function movePerfume(id, dir) {
  const idx = state.perfumes.findIndex(p => p.id === id);
  const newIdx = dir === "up" ? idx - 1 : idx + 1;

  [state.perfumes[idx], state.perfumes[newIdx]] = [state.perfumes[newIdx], state.perfumes[idx]];
  state.perfumes.forEach((p, i) => p.sortOrder = i);
  saveData(state);
  render();
}

// Resize + re-encode an uploaded image before it ever reaches localStorage. A raw phone photo
// can easily be 3-5MB as base64 — with two bottle photos per unisex perfume now, that fills the
// browser's storage quota fast and causes saves to fail silently. Capping the longest edge and
// re-encoding as JPEG keeps each image to a small fraction of that size with no visible quality loss
// at the sizes this app actually displays photos.
// onError is called (instead of silently keeping the original) when the browser can't decode the
// file at all — most commonly HEIC photos straight off an iPhone, which browsers cannot render via
// <img>. Falling back to the original in that case would defeat the whole point of compressing.
function compressImageDataUrl(dataUrl, maxDim, callback, onError) {
  const img = new Image();
  img.onload = () => {
    let width = img.naturalWidth, height = img.naturalHeight;
    if (!width || !height) { if (onError) onError(); else callback(dataUrl); return; }
    if (width > maxDim || height > maxDim) {
      if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
      else { width = Math.round(width * (maxDim / height)); height = maxDim; }
    }
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext("2d");
    // Fill white first — uploaded product photos are very often transparent PNGs, and JPEG has
    // no alpha channel, so without this the transparent areas turn solid black on export.
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, width, height);
    ctx.drawImage(img, 0, 0, width, height);
    try { callback(canvas.toDataURL("image/jpeg", 0.85)); }
    catch (e) { if (onError) onError(); else callback(dataUrl); }
  };
  img.onerror = () => { if (onError) onError(); else callback(dataUrl); };
  img.src = dataUrl;
}

  priceWrap.appendChild(el("h3", { className: "font-sans text-[11px] uppercase tracking-luxe text-primary" }, t(UI.pricingSize)));
  const priceGrid = el("div", { className: "grid gap-4 sm:grid-cols-2" });
  priceGrid.appendChild(fieldEl(t(UI.price), String(form.price), v => { form.price = v; }));
  priceGrid.appendChild(fieldEl(t(UI.sizeConcentration), form.size, v => { form.size = v; }));
  priceWrap.appendChild(priceGrid);
  wrap.appendChild(priceWrap);
  // Save bar
  wrap.appendChild(el("div", { className: "sticky bottom-0 -mx-6 flex items-center justify-between border-t border-border bg-background/95 px-6 py-4 backdrop-blur" },
    el("p", { className: "font-sans text-[10px] text-muted-foreground" }, lang === "en" ? "Editing in English" : "تحرير بالعربية"),
    el("button", {
      type: "button",
      onClick: () => {
        if (isNew) {
          const newId = "user-" + (form.displayLabel || form.name).toLowerCase().replace(/[^a-z0-9]/g, "-") + "-" + (form.family || "woody").toLowerCase().replace(/\s+/g, "-");
          const arch = ARCHETYPES.find(a => a.family === form.family) || ARCHETYPES[0];
          const newPerfume = {
            id: newId, slug: newId, name: form.name, displayLabel: form.displayLabel,
            taglineEn: form.taglineEn, taglineAr: form.taglineAr,
            descriptionEn: form.descriptionEn, descriptionAr: form.descriptionAr,
            family: form.family, familyEn: form.familyEn || form.family, familyAr: form.familyAr || form.family,
            timeOfDay: form.timeOfDay, timeOfDayEn: form.timeOfDayEn || form.timeOfDay, timeOfDayAr: form.timeOfDayAr || form.timeOfDay,
            topNotesEn: form.topNotesEn, topNotesAr: form.topNotesAr,
            heartNotesEn: form.heartNotesEn, heartNotesAr: form.heartNotesAr,
            baseNotesEn: form.baseNotesEn, baseNotesAr: form.baseNotesAr,
            personalityEn: form.personalityEn, personalityAr: form.personalityAr,
            whyMatchEn: form.whyMatchEn, whyMatchAr: form.whyMatchAr,
            price: Number(form.price) || 0, size: form.size,
            gradient: form.gradient, accent: form.accent,
            imageUrl: form.imageUrl || "", imageUrlMale: form.imageUrlMale || "", imageUrlFemale: form.imageUrlFemale || "",
            inspiredBy: form.inspiredBy, gender: form.gender || "unisex",
            isArchetype: false,
            // NEW: admin-created perfumes are explicitly marked as NOT shipped. This
            // protects them from the migration logic's "removed-shipped" filter —
            // even if the admin's perfume ID happens to no longer exist in defaults
            // (which is the normal case for admin-created perfumes), they survive.
            isShipped: false,
            enabled: true,
            sortOrder: state.perfumes.length,
          };
          state.perfumes.push(newPerfume);
        } else {
          Object.assign(editingPerfume, form);
          editingPerfume.price = Number(form.price) || 0;
        }
        const ok = saveData(state);
        if (ok) {
          editingPerfume = null; creatingPerfume = false;
          showToast(t(UI.saved), "");
        }
        render();
      },
      className: "h-10 border border-primary bg-primary px-6 font-sans text-xs uppercase tracking-wide-luxe text-white hover:bg-primary/90 flex items-center rounded-none",
    }, el("span", { className: "me-2" }, icon(ICONS.save, 16)), document.createTextNode(isNew ? t(UI.createPerfume) : t(UI.saveChanges)))
  ));
  return wrap;
}

function renderFamiliesTab() {
  const wrap = el("div", { className: "space-y-6 pb-12" });
  wrap.appendChild(el("div", { className: "border-b border-border pb-4" },
    el("h3", { className: "font-sans text-[11px] uppercase tracking-luxe text-primary" }, t(UI.familiesGuideTitle)),
    el("p", { className: "mt-2 font-sans text-xs text-muted-foreground" }, t(UI.familiesGuideDesc))
  ));
  FAMILY_GUIDE.forEach(g => {
    const fam = SCENT_FAMILIES.find(f => f.value === g.family);
    const card = el("div", { className: "border border-border bg-card p-5 rounded-sm" });
    const row = el("div", { className: "flex items-start gap-4" });
    row.appendChild(el("div", { className: "h-14 w-14 shrink-0 rounded-sm", style: { background: gradientClass(fam ? fam.gradient : "") } }));
    const right = el("div", { className: "min-w-0 flex-1" });
    right.appendChild(el("div", { className: "flex items-center justify-between" },
      el("h4", { className: "latin-serif text-lg text-foreground" }, t({ en: fam ? fam.labelEn : g.family, ar: fam ? fam.labelAr : g.family })),
      el("span", { className: "rounded-full px-3 py-1 font-sans text-[10px] uppercase tracking-wide-luxe text-white", style: { backgroundColor: fam ? fam.accent : "#888" } }, g.family)
    ));
    right.appendChild(el("p", { className: "mt-2 font-sans text-xs leading-relaxed text-foreground/80" }, t({ en: g.descEn, ar: g.descAr })));
    right.appendChild(el("div", { className: "mt-3 border-t border-border pt-3" },
      el("p", { className: "font-sans text-[10px] uppercase tracking-wide-luxe text-muted-foreground" }, t(UI.personalityArchetype)),
      el("p", { className: "mt-1 font-sans text-xs text-foreground" }, t({ en: g.personalityEn, ar: g.personalityAr }))
    ));
    const refsWrap = el("div", { className: "mt-3 border-t border-border pt-3" });
    refsWrap.appendChild(el("p", { className: "font-sans text-[10px] uppercase tracking-wide-luxe text-muted-foreground" }, t(UI.famousReferences)));
    const refs = el("div", { className: "mt-2 flex flex-wrap gap-2" });
    g.references.forEach(r => refs.appendChild(el("span", { className: "rounded-sm border border-border bg-secondary/40 px-2 py-1 font-sans text-[10px] text-foreground/80" }, r)));
    refsWrap.appendChild(refs);
    right.appendChild(refsWrap);
    row.appendChild(right);
    card.appendChild(row);
    wrap.appendChild(card);
  });
  return wrap;
}

// ====================== FORM HELPERS ======================
function fieldEl(label, value, onChange, hint) {
  const wrap = el("div", { className: "space-y-2" });
  wrap.appendChild(el("label", { className: "font-sans text-[11px] uppercase tracking-wide-luxe text-muted-foreground" }, label));
  const input = el("input", { type: "text", value: value || "", onInput: (e) => onChange(e.target.value), className: "rounded-none" });
  wrap.appendChild(input);
  if (hint) wrap.appendChild(el("p", { className: "font-sans text-[10px] text-muted-foreground" }, hint));
  return wrap;
}

function bilingualField(label, en, ar, onChange) {
  const wrap = el("div", { className: "space-y-2" });
  wrap.appendChild(el("label", { className: "font-sans text-[11px] uppercase tracking-wide-luxe text-muted-foreground" }, label));
  const input = el("input", {
    type: "text",
    value: (lang === "en" ? en : ar) || "",
    onInput: (e) => onChange(lang, e.target.value),
    dir: lang === "ar" ? "rtl" : "ltr",
    placeholder: lang === "en" ? "English" : "عربي",
    className: "rounded-none",
  });
  wrap.appendChild(input);
  wrap.appendChild(el("p", { className: "font-sans text-[10px] text-muted-foreground" }, lang === "en" ? "Editing in English. Toggle language in the header to edit the other." : "تحرير بالعربية. بدّل اللغة في الـ header لتحرير الأخرى."));
  return wrap;
}

function bilingualTextarea(label, en, ar, onChange) {
  const wrap = el("div", { className: "space-y-2" });
  wrap.appendChild(el("label", { className: "font-sans text-[11px] uppercase tracking-wide-luxe text-muted-foreground" }, label));
  const ta = el("textarea", {
    onInput: (e) => onChange(lang, e.target.value),
    dir: lang === "ar" ? "rtl" : "ltr",
    placeholder: lang === "en" ? "English" : "عربي",
    className: "rounded-none",
    rows: 4,
  });
  ta.value = (lang === "en" ? en : ar) || "";
  wrap.appendChild(ta);
  wrap.appendChild(el("p", { className: "font-sans text-[10px] text-muted-foreground" }, lang === "en" ? "Editing in English. Toggle language in the header to edit the other." : "تحرير بالعربية. بدّل اللغة في الـ header لتحرير الأخرى."));
  return wrap;
}

// ====================== INIT ======================
render();
</script>

</body>
</html>
